[workspace]
members = [
    "src-tauri",
    "crates/dona-core",
    "crates/dona-mcp-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Donatek <info@makahar.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/ma-kahar/dona-bridge"

[workspace.dependencies]
# Tauri
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"

# Secrets
keyring = { version = "3", features = ["windows-native"] }

# Security / App Lock
argon2 = "0.5"

# MCP
rmcp = { version = "0.1", features = ["server", "transport-sse", "transport-io", "macros"] }

# AI / HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }

# Backups
# age = "0.10"  # used in Phase 2 (encrypted backup) — uncomment then

# IPC typing
specta = { version = "2.0.0-rc", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }

# Errors / Logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows extras
sysinfo = "0.30"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.release]
opt-level = "s"   # optimise for size
lto = true
codegen-units = 1
strip = true
